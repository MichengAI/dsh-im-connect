name: 发布 npm 包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: 测试并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行完整测试
        run: npm test

      - name: 校验版本标签
        run: |
          node <<'NODE'
          const version = require('./package.json').version
          const expected = `v${version}`
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`版本标签 ${process.env.GITHUB_REF_NAME} 必须与 package.json 的 ${expected} 一致`)
          }
          NODE

      - name: 检查版本是否已发布
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@michengai/dsh-im-connect@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Version $version already published; skipping publish."
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 npm
        if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
