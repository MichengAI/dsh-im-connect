name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 执行完整检查
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: actions/github-script@v8
        with:
          script: |
            // 手动检查及发布调用始终执行完整检查；普通推送只跳过展示文档。
            if (${{ inputs.full == true }}) {
              core.setOutput('run_tests', 'true');
              return;
            }
            const base = context.eventName === 'pull_request'
              ? context.payload.pull_request.base.sha : context.payload.before;
            if (!base || /^0+$/.test(base) || context.ref.startsWith('refs/tags/')) {
              core.setOutput('run_tests', 'true');
              return;
            }
            const { execFileSync } = require('node:child_process');
            const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', base, 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const presentation = /^(?:README(?:\.[^/]+)?\.md|CHANGELOG(?:\.[^/]+)?\.md|docs\/.*|assets\/(?:branding|screenshots)\/.*)$/;
            const run = files.some(file => !presentation.test(file));
            core.setOutput('run_tests', String(run));
            core.info(run ? '执行完整检查' : '仅说明或展示图片变更，跳过完整测试');

  test:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Node.js 24 / DSH ${{ matrix.dsh }}
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.0-rc.1, 0.2.0-rc.2, 0.2.1-rc.1, 0.2.1-rc.2, 0.2.1-rc.3, 0.2.1-rc.4, 0.2.1-rc.5, 0.2.2-rc.1, 0.2.2-rc.2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装会话、命令、图片与管理认证契约测试宿主（隔离插件依赖）
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ matrix.dsh }}"
          args=(--prefix "$RUNNER_TEMP/dsh-image-contract" --no-audit --no-fund)
          cordis="4.0.4"
          schema="3.18.4"
          if [[ "$ver" == 0.2.1-* ]]; then
            cordis="4.0.5"
            schema="3.18.5"
          elif [[ "$ver" == 0.2.2-* ]]; then
            cordis="4.1.0"
            schema="3.19.0"
          fi
          pkgs=(
            "@deepseek-ai/cordis@${cordis}"
            "@deepseek-ai/schemastery@${schema}"
            "@deepseek-ai/dsh-api-session-controller@${ver}"
            "@deepseek-ai/dsh-commands@${ver}"
            "@deepseek-ai/dsh-attachment-local@${ver}"
            "@deepseek-ai/dsh-client-connection@${ver}"
            "@deepseek-ai/dsh-session-log-export@${ver}"
          )
          # 旧宿主的波浪号会选中新版附属包，显式保留该代依赖组合。
          if [[ "$ver" == 0.2.0-* ]]; then
            pkgs+=("@deepseek-ai/cordis-plugin-include@1.0.9" "@deepseek-ai/cordis-plugin-loader@1.0.5")
          fi
          npm install "${args[@]}" "${pkgs[@]}"

      - name: 安装文件读取契约测试宿主
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ matrix.dsh }}"
          cordis="4.0.4"
          schema="3.18.4"
          if [[ "$ver" == 0.2.1-* ]]; then
            cordis="4.0.5"
            schema="3.18.5"
          elif [[ "$ver" == 0.2.2-* ]]; then
            cordis="4.1.0"
            schema="3.19.0"
          fi
          pkgs=(
            "@deepseek-ai/cordis@${cordis}"
            "@deepseek-ai/schemastery@${schema}"
            "@deepseek-ai/dsh-fs-local@${ver}"
            "@deepseek-ai/dsh-api-workspace-files@${ver}"
          )
          if [[ "$ver" == 0.2.0-* ]]; then
            pkgs+=("@deepseek-ai/cordis-plugin-include@1.0.9" "@deepseek-ai/cordis-plugin-loader@1.0.5")
          fi
          npm install --prefix "$RUNNER_TEMP/dsh-file-contract" --ignore-scripts --no-audit --no-fund "${pkgs[@]}"

      - name: 编译并测试
        env:
          DSH_FILE_CONTRACT_ROOT: ${{ runner.temp }}/dsh-file-contract/node_modules/@deepseek-ai
          DSH_CHAT_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-api-session-controller
          DSH_ATTACHMENT_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-attachment-local
          DSH_CONNECTION_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-client-connection
          DSH_EXPORT_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai
        run: npm test

      - name: 校验发布包
        run: npm pack --dry-run
