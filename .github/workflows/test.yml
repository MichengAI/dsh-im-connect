name: 测试

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 24 / DSH ${{ matrix.dsh }}
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.1.2-rc.1, 0.1.5-rc.1, 0.1.5-rc.2]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装会话、命令、图片与管理认证契约测试宿主（隔离插件依赖）
        run: >-
          npm install --prefix "$RUNNER_TEMP/dsh-image-contract" --no-audit --no-fund
          @deepseek-ai/dsh-api-session-controller@${{ matrix.dsh }}
          @deepseek-ai/dsh-commands@${{ matrix.dsh }}
          @deepseek-ai/dsh-attachment-local@${{ matrix.dsh }}
          @deepseek-ai/dsh-client-connection@${{ matrix.dsh }}

      - name: 安装文件读取契约测试宿主
        run: >-
          npm install --prefix "$RUNNER_TEMP/dsh-file-contract" --ignore-scripts --no-audit --no-fund
          @deepseek-ai/cordis@4.0.2
          @deepseek-ai/dsh-fs-local@${{ matrix.dsh }}
          ${{ matrix.dsh != '0.1.2-rc.1' && format('@deepseek-ai/dsh-api-workspace-files@{0}', matrix.dsh) || '' }}

      - name: 编译并测试
        env:
          DSH_FILE_CONTRACT_ROOT: ${{ runner.temp }}/dsh-file-contract/node_modules/@deepseek-ai
          DSH_CHAT_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-api-session-controller
          DSH_ATTACHMENT_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-attachment-local
          DSH_CONNECTION_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-client-connection
        run: npm test

      - name: 校验发布包
        run: npm pack --dry-run
