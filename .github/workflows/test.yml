name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 执行完整检查
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: actions/github-script@v8
        with:
          script: |
            // 手动检查及发布调用始终执行完整检查；普通推送只跳过展示文档。
            if (${{ inputs.full == true }}) {
              core.setOutput('run_tests', 'true');
              return;
            }
            const base = context.eventName === 'pull_request'
              ? context.payload.pull_request.base.sha : context.payload.before;
            if (!base || /^0+$/.test(base) || context.ref.startsWith('refs/tags/')) {
              core.setOutput('run_tests', 'true');
              return;
            }
            const { execFileSync } = require('node:child_process');
            const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', base, 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const presentation = /^(?:README(?:\.[^/]+)?\.md|CHANGELOG(?:\.[^/]+)?\.md|docs\/.*|assets\/(?:branding|screenshots)\/.*)$/;
            const run = files.some(file => !presentation.test(file));
            core.setOutput('run_tests', String(run));
            core.info(run ? '执行完整检查' : '仅说明或展示图片变更，跳过完整测试');

  test:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Node.js 24 / DSH ${{ matrix.dsh }}
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.1.2-rc.1, 0.1.5-rc.1, 0.1.5-rc.2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装会话、命令、图片与管理认证契约测试宿主（隔离插件依赖）
        run: >-
          npm install --prefix "$RUNNER_TEMP/dsh-image-contract" --no-audit --no-fund
          @deepseek-ai/dsh-api-session-controller@${{ matrix.dsh }}
          @deepseek-ai/dsh-commands@${{ matrix.dsh }}
          @deepseek-ai/dsh-attachment-local@${{ matrix.dsh }}
          @deepseek-ai/dsh-client-connection@${{ matrix.dsh }}

      - name: 安装文件读取契约测试宿主
        run: >-
          npm install --prefix "$RUNNER_TEMP/dsh-file-contract" --ignore-scripts --no-audit --no-fund
          @deepseek-ai/cordis@4.0.2
          @deepseek-ai/dsh-fs-local@${{ matrix.dsh }}
          ${{ matrix.dsh != '0.1.2-rc.1' && format('@deepseek-ai/dsh-api-workspace-files@{0}', matrix.dsh) || '' }}

      - name: 编译并测试
        env:
          DSH_FILE_CONTRACT_ROOT: ${{ runner.temp }}/dsh-file-contract/node_modules/@deepseek-ai
          DSH_CHAT_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-api-session-controller
          DSH_ATTACHMENT_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-attachment-local
          DSH_CONNECTION_CONTRACT_ROOT: ${{ runner.temp }}/dsh-image-contract/node_modules/@deepseek-ai/dsh-client-connection
        run: npm test

      - name: 校验发布包
        run: npm pack --dry-run
